name: Push gem to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'sferik/twitter-ruby'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/twitter
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Update RubyGems
        run: gem update --system
      - name: Build gem
        run: bundle exec rake build
      - name: Sign gem with Sigstore
        run: gem exec sigstore-cli sign pkg/*.gem --bundle pkg/twitter.gem.sigstore.json
      - name: Push gem
        run: gem push pkg/*.gem --attestation pkg/twitter.gem.sigstore.json
      - name: Wait for release
        run: |
          # (Until RubyGems.org has each gem's version, 5 minutes at most.)
          for gem in pkg/*.gem; do
            url=$(ruby -rrubygems/package -e 'spec = Gem::Package.new(ARGV[0]).spec; print "https://rubygems.org/api/v2/rubygems/#{spec.name}/versions/#{spec.version}.json?platform=#{spec.platform}"' "$gem")
            for attempt in $(seq 60); do
              curl --silent --fail --output /dev/null "$url" && break
              if [ "$attempt" -eq 60 ]; then
                echo "::error::$gem isn't on RubyGems.org after 5 minutes"
                exit 1
              fi
              sleep 5
            done
          done
